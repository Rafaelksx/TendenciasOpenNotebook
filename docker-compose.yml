services:
  ollama:
    image: ollama/ollama:latest
    container_name: open_notebook_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
      # Permite usar la GPU Nvidia si está disponible y configurada en Docker.
    # Si no hay GPU Nvidia, Docker Compose fallará o se ejecutará en CPU según la versión de Docker.
    # En caso de incompatibilidad de GPU en Docker, se puede comentar esta sección deploy.
    #deploy:
      #resources:
       # reservations:
        #  devices:
         #   - driver: nvidia
          #    count: all
              #capabilities: [gpu]
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: open_notebook_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opennotebook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opennotebook_pass}
      POSTGRES_DB: ${POSTGRES_DB:-opennotebook}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: open_notebook_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opennotebook_user}:${POSTGRES_PASSWORD:-opennotebook_pass}@db:5432/${POSTGRES_DB:-opennotebook}
    depends_on:
      - db
    restart: unless-stopped

  open-notebook-app:
    build: .
    container_name: open_notebook_ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:1.5b
      - EMBEDDING_MODEL=nomic-embed-text
      - API_HOST=api
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opennotebook_user}:${POSTGRES_PASSWORD:-opennotebook_pass}@db:5432/${POSTGRES_DB:-opennotebook}
    volumes:
      - vdb_storage:/app/data
    depends_on:
      - ollama
      - db
      - api
    restart: unless-stopped

volumes:
  ollama_storage:
  vdb_storage:
  pgdata: